name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -race

      - name: build
        run: make build

      # The generated CRDs are committed, so a change to the API types that was
      # not regenerated would otherwise ship a schema that does not match the Go
      # structs -- which is exactly the mismatch that made every status write
      # fail the first time this was deployed.
      - name: generated manifests are up to date
        run: |
          make generate
          if ! git diff --exit-code -- deploy/crds pkg/apis; then
            echo "run 'make generate' and commit the result"; exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: helm/kind-action@v1
        with:
          cluster_name: kqos
          config: deploy/kind-cluster.yaml

      - name: build and load the image
        run: make kind-load ARCH=amd64

      - name: deploy
        run: make deploy

      - name: the agents must actually measure something
        run: |
          # Wait for every node to publish a reclaimable figure. A profile with
          # an empty status means the agent started but its reporting path is
          # broken, which no unit test can catch.
          for i in $(seq 1 60); do
            ready=$(kubectl get noderesourceprofiles \
              -o jsonpath='{range .items[*]}{.status.reclaimable.cpu}{"\n"}{end}' \
              | grep -c . || true)
            total=$(kubectl get nodes --no-headers | wc -l)
            [ "$ready" = "$total" ] && break
            sleep 5
          done
          kubectl get noderesourceprofiles -o wide
          test "$ready" = "$total"

      - name: the reclaimed tier must be rewritten and scheduled
        run: |
          kubectl apply -f examples/

          # Deliberately NOT a full rollout wait. Each batch replica asks for
          # 1500m of reclaimed CPU, and how many of them fit is a function of
          # how much idle capacity kqos actually measured on this machine -- on
          # a 4-core runner that is two pods, not four. Asserting a replica
          # count here would be asserting the size of the runner rather than
          # the behaviour of the code.
          for i in $(seq 1 36); do
            ready=$(kubectl -n kqos-demo get deploy batch-etl \
              -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo 0)
            [ "${ready:-0}" -ge 1 ] && break
            sleep 5
          done
          kubectl -n kqos-demo get pods -o wide
          test "${ready:-0}" -ge 1

      - name: the rewrite must remove the native cpu request
        run: |
          req=$(kubectl -n kqos-demo get pod -l app=batch-etl \
            --field-selector status.phase=Running \
            -o json | jq -c '.items[0].spec.containers[0].resources.requests')
          echo "requests after admission: $req"

          # The extended resource must be there ...
          echo "$req" | jq -e 'has("kqos.io/reclaimed-cpu")' >/dev/null
          # ... and the native cpu request must be gone. This is the whole
          # mechanism: after admission the pod is invisible to the scheduler's
          # real-capacity accounting.
          echo "$req" | jq -e 'has("cpu") | not' >/dev/null
          # The original spec must still be recoverable for debugging.
          kubectl -n kqos-demo get pod -l app=batch-etl \
            -o jsonpath='{.items[0].metadata.annotations.kqos\.io/original-resources}' \
            | grep -q 1500m

      - name: extended resources must be what gates scheduling
        run: |
          # Any batch replica that did not fit must be Pending specifically
          # because the node ran out of kqos.io/reclaimed-cpu -- not because it
          # ran out of real CPU. That distinction is the entire design, and a
          # short cluster is the only place it can be observed.
          pending=$(kubectl -n kqos-demo get pods -l app=batch-etl \
            --field-selector status.phase=Pending -o name | wc -l)
          echo "pending replicas: $pending"
          if [ "$pending" -gt 0 ]; then
            msg=$(kubectl -n kqos-demo describe pods -l app=batch-etl \
              | grep -A2 "FailedScheduling" | head -20)
            echo "$msg"
            echo "$msg" | grep -q "kqos.io/reclaimed-cpu"
          fi

      - name: dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n kqos-system get pods -o wide || true
          kubectl -n kqos-system logs -l app.kubernetes.io/component=agent --tail=100 --max-log-requests=6 || true
          kubectl -n kqos-system logs -l app.kubernetes.io/component=controller --tail=100 --max-log-requests=4 || true
