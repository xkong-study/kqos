apiVersion: v1
kind: Namespace
metadata:
  name: kqos-demo
  labels:
    kqos.io/demo: "true"
---
# Reclaimed pods must sort below everything else when the scheduler and the
# kubelet decide what to keep. A negative priority class is how that is
# expressed cluster-wide, and the webhook refuses any reclaimed pod carrying a
# positive priority.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kqos-reclaimed
value: -100
globalDefault: false
preemptionPolicy: Never
description: "Best-effort tier running on capacity kqos has resold. First to be preempted, first to be evicted."
