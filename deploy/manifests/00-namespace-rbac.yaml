apiVersion: v1
kind: Namespace
metadata:
  name: kqos-system
  labels:
    kqos.io/managed: "true"
    # The webhook must never intercept pods in its own namespace. A webhook
    # that has to be running in order for its own pods to be admitted cannot
    # recover from a full restart.
    kqos.io/webhook: "disabled"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kqos-agent
  namespace: kqos-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kqos-controller
  namespace: kqos-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kqos-webhook
  namespace: kqos-system
---
# The agent's permissions are deliberately narrow. It reads what is on its own
# node, writes its own profile, and evicts. It has no ability to modify pods,
# nodes or policy -- an agent running on every node in the cluster is the worst
# possible place to put a broad grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kqos-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["kqos.io"]
    resources: ["noderesourceprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kqos.io"]
    resources: ["noderesourceprofiles/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kqos.io"]
    resources: ["qospolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kqos-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kqos-agent
subjects:
  - kind: ServiceAccount
    name: kqos-agent
    namespace: kqos-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kqos-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Writing extended resources onto nodes is the controller's single most
  # consequential power and the only write it has outside its own CRDs.
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kqos.io"]
    resources: ["noderesourceprofiles", "qospolicies", "workloadprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kqos.io"]
    resources: ["noderesourceprofiles/status", "qospolicies/status", "workloadprofiles/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kqos-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kqos-controller
subjects:
  - kind: ServiceAccount
    name: kqos-controller
    namespace: kqos-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kqos-webhook
rules:
  - apiGroups: ["kqos.io"]
    resources: ["qospolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kqos-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kqos-webhook
subjects:
  - kind: ServiceAccount
    name: kqos-webhook
    namespace: kqos-system
