apiVersion: apps/v1
kind: Deployment
metadata:
  name: kqos-webhook
  namespace: kqos-system
  labels:
    app.kubernetes.io/name: kqos
    app.kubernetes.io/component: webhook
spec:
  # No leader election here: every replica must serve admission, or a restart
  # of the leader would stall pod creation cluster-wide.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kqos
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kqos
        app.kubernetes.io/component: webhook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        kqos.io/qos-level: system_cores
    spec:
      serviceAccountName: kqos-webhook
      priorityClassName: system-cluster-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kqos
                    app.kubernetes.io/component: webhook
      containers:
        - name: webhook
          image: kqos:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/kqos-webhook"]
          args:
            - --port=9443
            - --cert-dir=/etc/kqos/certs
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --zap-log-level=info
          ports:
            - name: webhook
              containerPort: 9443
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: certs
              mountPath: /etc/kqos/certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: certs
          secret:
            secretName: kqos-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: kqos-webhook
  namespace: kqos-system
  labels:
    app.kubernetes.io/name: kqos
    app.kubernetes.io/component: webhook
spec:
  selector:
    app.kubernetes.io/name: kqos
    app.kubernetes.io/component: webhook
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
    - name: metrics
      port: 8080
      targetPort: 8080
