---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: qospolicies.kqos.io
spec:
  group: kqos.io
  names:
    categories:
    - kqos
    kind: QoSPolicy
    listKind: QoSPolicyList
    plural: qospolicies
    shortNames:
    - qp
    singular: qospolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.observedNodes
      name: Nodes
      type: integer
    - jsonPath: .status.readyNodes
      name: Ready
      type: integer
    - jsonPath: .status.totalReclaimableCpu
      name: Reclaim-CPU
      type: string
    - jsonPath: .status.totalReclaimableMemory
      name: Reclaim-Mem
      type: string
    - jsonPath: .status.effectiveOvercommitPercent
      name: Overcommit%
      type: integer
    - jsonPath: .status.nodesUnderPressure
      name: Pressure
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: QoSPolicy is the cluster-wide, hot-reloadable configuration for
          kqos.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              QoSPolicySpec is the whole tunable surface of kqos, in one object. Changing
              it takes effect without restarting any component: the agent and controller
              both watch it and swap configuration in place.
            properties:
              advisor:
                description: AdvisorConfig tunes the smoothing applied to raw cgroup
                  samples.
                properties:
                  algorithm:
                    default: p95
                    description: Algorithm selects how the window is collapsed into
                      one number.
                    enum:
                    - p95
                    - p99
                    - max
                    - ewma
                    type: string
                  ewmaAlpha:
                    default: "0.3"
                    description: EWMAAlpha is the smoothing factor when Algorithm
                      is "ewma".
                    type: string
                  intervalSeconds:
                    default: 10
                    description: IntervalSeconds is the sampling period.
                    format: int32
                    minimum: 1
                    type: integer
                  windowSeconds:
                    default: 300
                    description: WindowSeconds is how much history the advisor keeps
                      per node.
                    format: int32
                    minimum: 30
                    type: integer
                required:
                - algorithm
                - intervalSeconds
                - windowSeconds
                type: object
              cpuSet:
                description: CPUSetConfig controls how the agent partitions the node's
                  CPUs.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled turns on cpuset actuation. Off by default because it writes to
                      the host cgroup tree.
                    type: boolean
                  reclaimedPoolMinCpus:
                    default: 1
                    description: ReclaimedPoolMinCPUs is the same floor for the reclaimed
                      tier.
                    format: int32
                    type: integer
                  reservedSystemCpus:
                    description: |-
                      ReservedSystemCPUs is a cpuset expression kept for system_cores and the
                      kubelet itself, e.g. "0-1".
                    type: string
                  sharedPoolMinCpus:
                    default: 2
                    description: |-
                      SharedPoolMinCPUs guarantees the shared tier never shrinks below this many
                      CPUs regardless of dedicated demand.
                    format: int32
                    type: integer
                required:
                - enabled
                - reclaimedPoolMinCpus
                - sharedPoolMinCpus
                type: object
              eviction:
                description: EvictionConfig configures the node-local eviction manager.
                properties:
                  cpuPressureThresholdPercent:
                    default: 92
                    description: |-
                      CPUPressureThresholdPercent is the equivalent CPU trigger. CPU is
                      compressible so this is deliberately high: throttling is preferred to
                      eviction, and eviction only happens when throttling has stopped working.
                    format: int32
                    type: integer
                  cpuSomeStalledThresholdPercent:
                    default: 40
                    description: |-
                      CPUSomeStalledThresholdPercent triggers on PSI rather than utilisation,
                      catching contention on nodes that never look busy.
                    format: int32
                    type: integer
                  disabledPlugins:
                    description: DisabledPlugins names eviction plugins to skip.
                    items:
                      type: string
                    type: array
                  dryRun:
                    default: false
                    description: |-
                      DryRun evaluates every plugin and records the verdict without calling the
                      eviction API.
                    type: boolean
                  enabled:
                    default: true
                    description: |-
                      Enabled turns the eviction manager on. When false the manager still runs
                      and emits metrics but never evicts, which is how you validate thresholds
                      against production traffic before arming them.
                    type: boolean
                  gracePeriodSeconds:
                    default: 30
                    description: GracePeriodSeconds is passed to the eviction API.
                    format: int64
                    type: integer
                  maxEvictionsPerMinute:
                    default: 3
                    description: |-
                      MaxEvictionsPerMinute rate-limits the manager so a metrics glitch cannot
                      drain a node.
                    format: int32
                    minimum: 0
                    type: integer
                  memoryPressureThresholdPercent:
                    default: 85
                    description: |-
                      MemoryPressureThresholdPercent is the node memory utilisation above which
                      the memory-pressure plugin starts selecting victims.
                    format: int32
                    type: integer
                  stabilisationSeconds:
                    default: 30
                    description: |-
                      StabilisationSeconds is how long a threshold must stay breached before the
                      first eviction, preventing reaction to a single bad sample.
                    format: int32
                    type: integer
                required:
                - cpuPressureThresholdPercent
                - cpuSomeStalledThresholdPercent
                - dryRun
                - enabled
                - gracePeriodSeconds
                - maxEvictionsPerMinute
                - memoryPressureThresholdPercent
                - stabilisationSeconds
                type: object
              nodeSelector:
                description: NodeSelector limits this policy to a subset of nodes.
                  Empty means all.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              overcommit:
                description: OvercommitConfig controls how aggressively unused capacity
                  is resold.
                properties:
                  cpuTargetUtilizationPercent:
                    default: 75
                    description: |-
                      CPUTargetUtilizationPercent is the node CPU utilisation kqos aims for
                      after reclaimed pods are packed on. Reclaimable CPU is computed as
                      (target% of allocatable) - (actual usage of the guaranteed tiers).
                    format: int32
                    maximum: 95
                    minimum: 10
                    type: integer
                  headroomPercent:
                    default: 10
                    description: |-
                      HeadroomPercent is withheld from the reclaimable figure to absorb a burst
                      from the guaranteed tiers between two advisor ticks. This is the single
                      most important safety knob in kqos.
                    format: int32
                    maximum: 50
                    minimum: 0
                    type: integer
                  maxReclaimRatioPercent:
                    default: 50
                    description: |-
                      MaxReclaimRatioPercent caps reclaimable resources at this fraction of
                      allocatable, no matter what the usage maths says. Protects against a node
                      that is genuinely idle being packed to the point where a single traffic
                      spike cannot be absorbed.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  memoryTargetUtilizationPercent:
                    default: 65
                    description: |-
                      MemoryTargetUtilizationPercent is the same target for memory. Memory is
                      incompressible, so this should stay well below the CPU target.
                    format: int32
                    maximum: 90
                    minimum: 10
                    type: integer
                  minReclaimCpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MinReclaimCPU is a floor below which reclaimable CPU is reported as zero,
                      avoiding churn from advertising slivers of a core.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  minReclaimMemory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: MinReclaimMemory is the equivalent floor for memory.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - cpuTargetUtilizationPercent
                - headroomPercent
                - maxReclaimRatioPercent
                - memoryTargetUtilizationPercent
                type: object
              webhook:
                description: WebhookConfig controls admission behaviour.
                properties:
                  defaultQoSLevel:
                    default: shared_cores
                    description: DefaultQoSLevel is applied to pods that carry no
                      QoS annotation.
                    type: string
                  exemptNamespaces:
                    description: ExemptNamespaces are never mutated.
                    items:
                      type: string
                    type: array
                  rewriteReclaimedResources:
                    default: true
                    description: |-
                      RewriteReclaimedResources makes the webhook translate cpu/memory requests
                      on reclaimed pods into kqos.io/reclaimed-* extended resources, so the
                      native scheduler never counts them against real capacity.
                    type: boolean
                required:
                - defaultQoSLevel
                - rewriteReclaimedResources
                type: object
            required:
            - advisor
            - cpuSet
            - eviction
            - overcommit
            - webhook
            type: object
          status:
            description: QoSPolicyStatus is the cluster-wide rollup maintained by
              the controller.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              effectiveOvercommitPercent:
                description: |-
                  EffectiveOvercommitPercent is reclaimable capacity as a percentage of
                  real allocatable capacity: the headline number for how much extra cluster
                  kqos has manufactured.
                format: int32
                type: integer
              lastUpdated:
                description: LastUpdated is when this rollup was computed.
                format: date-time
                type: string
              nodesUnderPressure:
                description: NodesUnderPressure counts nodes not at PressureNone.
                format: int32
                type: integer
              observedNodes:
                description: ObservedNodes is how many NodeResourceProfiles matched
                  the selector.
                format: int32
                type: integer
              readyNodes:
                description: ReadyNodes is how many of those reported a healthy agent
                  recently.
                format: int32
                type: integer
              totalReclaimableCpu:
                anyOf:
                - type: integer
                - type: string
                description: TotalReclaimableCPU is the sum of reclaimable CPU across
                  matched nodes.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              totalReclaimableMemory:
                anyOf:
                - type: integer
                - type: string
                description: TotalReclaimableMemory is the memory equivalent.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
